name: guard

# 公開LPの機械ガード（サーバ側＝飛ばせない関門）。
# push / PR のたびに個人情報スキャン、内部リンク検査、再現契約検査を回し、
# 引っかかれば失敗させて公開（main反映）をブロックする。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: 個人情報スキャン（顧客名・個人情報の混入を弾く）
        run: |
          chmod +x scripts/scan-personal-info.sh
          bash scripts/scan-personal-info.sh .

      - name: 内部リンク切れ検査
        run: |
          chmod +x scripts/check-links-static.sh
          bash scripts/check-links-static.sh

      - name: MN4再現契約と明示計算の検査
        run: |
          node scripts/build-mn1-member.js
          git diff --exit-code -- ideco-mirai-navi/index.html
          node scripts/verify-mn1-member.js
          node scripts/test-mn1-member.js
          node scripts/test-member-feedback-v1-1.js
          node scripts/test-member-explicit-calculation.js
          node scripts/test-member-human-probability-ui.js
          node scripts/test-member-affordability-band.js

      - name: MN4再現コードの総当たり検査
        run: node scripts/fuzz-mn1-member.js
